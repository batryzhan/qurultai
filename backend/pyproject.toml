[project]
name = "qurultai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ['app*']

